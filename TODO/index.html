<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TODO List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="todo-app" aria-label="Todo list application">
      <header class="hero">
        <p class="kicker">DAILY PRODUCTIVITY</p>
        <h1>TODO LIST</h1>
        <p class="subtitle">Plan smarter with priorities, due dates, filters, sorting, and progress tracking across pending and completed tasks.</p>
      </header>

      <form id="task-form" class="task-form" novalidate>
        <div class="field-group grow">
          <label class="sr-only" for="task-input">Task name</label>
          <input id="task-input" type="text" placeholder="Add a task for today..." maxlength="120" />
        </div>

        <div class="field-group">
          <label class="sr-only" for="priority-input">Priority</label>
          <select id="priority-input">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <div class="field-group">
          <label class="sr-only" for="due-input">Due date and time</label>
          <input id="due-input" type="datetime-local" />
        </div>

        <button type="submit">Add Task</button>
      </form>

      <p id="error-text" class="error" aria-live="polite"></p>

      <section class="controls" aria-label="Task controls">
        <input id="search-input" type="search" placeholder="Search tasks..." />

        <select id="status-filter">
          <option value="all">All Statuses</option>
          <option value="pending">Pending Only</option>
          <option value="completed">Completed Only</option>
        </select>

        <select id="priority-filter">
          <option value="all">All Priorities</option>
          <option value="high">High Priority</option>
          <option value="medium">Medium Priority</option>
          <option value="low">Low Priority</option>
        </select>

        <select id="sort-by">
          <option value="newest">Sort: Newest</option>
          <option value="oldest">Sort: Oldest</option>
          <option value="dueSoon">Sort: Due Soon</option>
          <option value="priority">Sort: Priority</option>
        </select>

        <button id="mark-all" type="button" class="ghost">Mark All Done</button>
        <button id="clear-completed" type="button" class="ghost danger">Clear Completed</button>
      </section>

      <section class="stats" aria-label="Task statistics">
        <article class="stat-card">
          <p>Total</p>
          <h3 id="stat-total">0</h3>
        </article>
        <article class="stat-card">
          <p>Pending</p>
          <h3 id="stat-pending">0</h3>
        </article>
        <article class="stat-card">
          <p>Completed</p>
          <h3 id="stat-completed">0</h3>
        </article>
        <article class="stat-card">
          <p>Overdue</p>
          <h3 id="stat-overdue">0</h3>
        </article>
      </section>

      <div class="progress-wrap" aria-label="Completion progress">
        <p id="progress-text">0% completed</p>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>

      <section class="board" aria-label="Task board">
        <article class="column">
          <div class="column-head">
            <h2>Pending Tasks</h2>
            <span id="pending-count" class="count">0</span>
          </div>
          <ul id="pending-list" class="task-list" aria-label="Pending tasks"></ul>
        </article>

        <article class="column completed-column">
          <div class="column-head">
            <h2>Completed Tasks</h2>
            <span id="completed-count" class="count">0</span>
          </div>
          <ul id="completed-list" class="task-list" aria-label="Completed tasks"></ul>
        </article>
      </section>
    </section>
  </main>

  <template id="task-template">
    <li class="task-item">
      <div class="task-main">
        <div class="task-topline">
          <span class="badge-priority"></span>
          <span class="badge-due"></span>
        </div>
        <p class="task-text"></p>
        <p class="task-meta"></p>
      </div>
      <div class="task-actions">
        <button class="btn-action btn-toggle" type="button"></button>
        <button class="btn-action btn-edit" type="button">Edit</button>
        <button class="btn-action btn-delete" type="button">Delete</button>
      </div>
    </li>
  </template>

  <div id="edit-modal" class="modal" hidden>
    <div class="modal-overlay" data-close-modal></div>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <h2 id="edit-title">Edit Task</h2>
      <form id="edit-form" class="edit-form" novalidate>
        <label for="edit-text">Task</label>
        <input id="edit-text" type="text" maxlength="120" />

        <label for="edit-priority">Priority</label>
        <select id="edit-priority">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <label for="edit-due">Due date and time</label>
        <input id="edit-due" type="datetime-local" />

        <div class="modal-actions">
          <button type="button" id="cancel-edit" class="ghost">Cancel</button>
          <button type="submit">Save Changes</button>
        </div>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
