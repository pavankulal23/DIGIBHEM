<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <section class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div>
          <p class="kicker">UTILITY</p>
          <h1>Calculator</h1>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">Theme</button>
      </header>

      <section class="display-wrap" aria-live="polite">
        <p id="expression" class="expression">0</p>
        <p id="result" class="result">0</p>
      </section>

      <div class="keypad" role="group" aria-label="Calculator buttons">
        <button class="btn btn-fn" data-action="clear">AC</button>
        <button class="btn btn-fn" data-action="delete">DEL</button>
        <button class="btn btn-fn" data-value="%">%</button>
        <button class="btn btn-op" data-value="/">÷</button>

        <button class="btn" data-value="7">7</button>
        <button class="btn" data-value="8">8</button>
        <button class="btn" data-value="9">9</button>
        <button class="btn btn-op" data-value="*">×</button>

        <button class="btn" data-value="4">4</button>
        <button class="btn" data-value="5">5</button>
        <button class="btn" data-value="6">6</button>
        <button class="btn btn-op" data-value="-">−</button>

        <button class="btn" data-value="1">1</button>
        <button class="btn" data-value="2">2</button>
        <button class="btn" data-value="3">3</button>
        <button class="btn btn-op" data-value="+">+</button>

        <button class="btn btn-wide" data-action="sign">+/-</button>
        <button class="btn" data-value="0">0</button>
        <button class="btn" data-value=".">.</button>
        <button class="btn btn-eq" data-action="equals">=</button>
      </div>

      <section class="tips">
        <p>Keyboard: 0-9, +, -, *, /, Enter, Backspace, Esc</p>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
